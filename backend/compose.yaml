# Full local stack: Postgres, Redis, and the app itself (frontend + backend
# bundled into one image by the repo-root Containerfile).
#
# Usage (requires podman-compose):
#   cp .env.example .env   # adjust credentials as needed
#   podman-compose up -d --build
#
# Redis backs access-token storage, session metadata, and rate limiting,
# with AOF persistence so local sessions survive a restart.

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c10s:latest
    container_name: debt_postgres
    restart: unless-stopped
    environment:
      POSTGRESQL_USER: ${POSTGRES_USER:-debt_admin}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-debt_dev_password}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-debt_collection}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-debt_admin} -d ${POSTGRES_DB:-debt_collection}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - debt_network

  redis:
    image: quay.io/sclorg/redis-7-c9s:latest
    container_name: debt_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-debt_dev_password}
    command: ["run-redis", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-debt_dev_password} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - debt_network

  app:
    build:
      # Relative to this file, so `..` is the repo root, where the
      # Containerfile lives (podman-compose picks it up by name).
      context: ..
    image: tenants:local
    container_name: debt_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-debt_admin}:${POSTGRES_PASSWORD:-debt_dev_password}@postgres:5432/${POSTGRES_DB:-debt_collection}
      REDIS_URL: redis://:${REDIS_PASSWORD:-debt_dev_password}@redis:6379
      BIND_ADDR: 0.0.0.0:8080
      # The admin stack runs as a separate compose project, so reach it
      # through the host.
      ADMIN_API_URL: ${ADMIN_API_URL_CONTAINER:-http://host.containers.internal:8081}
      TENANT_API_KEY: ${TENANT_API_KEY:-}
      EXECUTIVE_MANAGER_EMAIL: ${EXECUTIVE_MANAGER_EMAIL:-}
      EXECUTIVE_MANAGER_PASSWORD: ${EXECUTIVE_MANAGER_PASSWORD:-}
      EXECUTIVE_MANAGER_NAME: ${EXECUTIVE_MANAGER_NAME:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - debt_network

networks:
  debt_network:
    driver: bridge

volumes:
  postgres_data:
    name: debt_postgres_data
  redis_data:
    name: debt_redis_data
